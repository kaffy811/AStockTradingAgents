[pytest]
asyncio_mode = auto
pythonpath = backend
testpaths = backend/tests
markers =
    unit: hermetic unit tests with no external services
    integration_local: local integration tests using fakes, in-memory stores, or local-only resources
    integration_live: integration tests requiring configured live services
    live_external: tests requiring external network, DNS, Supabase, CNINFO, BaoStock, or live RAG worker
    soak: long-running soak/stress tests, excluded from default runs
    live_supabase: legacy marker for Supabase-backed live tests; treated as integration_live + live_external
norecursedirs =
    .git
    .venv
    backend/.venv
    frontend
    node_modules
    dist
    build
    .clone
    .claude
    HKNA
filterwarnings =
    default
