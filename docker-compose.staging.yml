# ── TradingAgents — Isolated Containerized Staging Override ───────────────────
#
# Phase 6V-P1.25: Pi Canary Gate C Closure — Containerized Staging
#
# Usage:
#   DEPLOYMENT_SHA=$(git rev-parse HEAD) \
#   docker compose \
#     -p tradingagents-p125-staging \
#     -f docker-compose.yml \
#     -f docker-compose.staging.yml \
#     --env-file .env.staging.local \
#     up -d --build
#
# Isolation guarantees:
#   - Compose project: tradingagents-p125-staging (distinct from dev/prod)
#   - Network:         tradingagents-p125-staging_internal (separate from prod internal)
#   - Host binding:    127.0.0.1:18000 (backend), 127.0.0.1:18080 (frontend)
#   - Postgres:        127.0.0.1:15432 (isolated staging DB; not shared with dev/prod)
#   - NOT exposed to public internet
#   - All secrets in .env.staging.local (gitignored, not committed)
#
# Purpose:
#   Provide a real deployed runtime for Gate C verification.
#   The backend lifespan must call load_canary_config(settings) and confirm
#   rollout=75, config_version=8, stable_bucket_salt=pi_v1.
#   After Gate C PASS: promote to rollout=100, config_version=9.
#
# Do NOT use in production. Do NOT commit .env.staging.local.

services:

  # ── Isolated Staging Postgres ─────────────────────────────────────────────
  # Intentionally NOT in the base docker-compose.yml (which uses Supabase cloud).
  # This is a self-contained local Postgres for Gate C staging only.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${STAGING_POSTGRES_DB:-tradingagents_staging}
      - POSTGRES_USER=${STAGING_POSTGRES_USER:-staging_user}
      - POSTGRES_PASSWORD=${STAGING_POSTGRES_PASSWORD:-staging_changeme}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_POSTGRES_USER:-staging_user}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - staging-internal

  # ── Redis (redirect to staging-internal network) ──────────────────────────
  redis:
    networks:
      - staging-internal
    ports: []

  # ── Migrate (one-shot Alembic; override DATABASE_URL to local postgres) ───
  migrate:
    networks:
      - staging-internal
    environment:
      - APP_ENV=staging
      - ENABLE_CREATE_ALL=false
      - REDIS_URL=redis://redis:6379
      # Local staging postgres — overrides any cloud DATABASE_URL from env_file
      - DATABASE_URL=postgresql+asyncpg://${STAGING_POSTGRES_USER:-staging_user}:${STAGING_POSTGRES_PASSWORD:-staging_changeme}@postgres:5432/${STAGING_POSTGRES_DB:-tradingagents_staging}
    build:
      args:
        - DEPLOYMENT_SHA=${DEPLOYMENT_SHA:-unknown}
        - DEPLOYMENT_MODE=containerized_staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Backend (staging config + Gate C snapshot probe) ─────────────────────
  backend:
    networks:
      - staging-internal
    ports:
      # Expose on loopback only — runtime probe uses curl/python from host
      - "127.0.0.1:18000:8000"
    env_file:
      - .env.staging.local
    environment:
      - APP_ENV=staging
      - DEBUG=false
      - REDIS_URL=redis://redis:6379
      # Local staging postgres — overrides any cloud DATABASE_URL from .env.staging.local
      - DATABASE_URL=postgresql+asyncpg://${STAGING_POSTGRES_USER:-staging_user}:${STAGING_POSTGRES_PASSWORD:-staging_changeme}@postgres:5432/${STAGING_POSTGRES_DB:-tradingagents_staging}
      # Allow ORM create-all on first start (staging DB is fresh)
      - ENABLE_CREATE_ALL=true
      # Phase 6V-P1.24+: snapshot written here; probed via docker exec or HTTP
      - PI_CANARY_SNAPSHOT_PATH=/tmp/tradingagents-runtime/pi_canary_snapshot.json
      # Activates containerized_deployed_staging_runtime evidence mode in snapshot v2
      - DEPLOYMENT_MODE=containerized_staging
      - DEPLOYMENT_SHA=${DEPLOYMENT_SHA:-unknown}
      # Canary staging config — sourced from .env.staging.local via variable sub
      # These override any canary env vars in .env.staging.local at compose-yaml level.
      # Actual PI_CANARY_* values come from .env.staging.local loaded above.
    build:
      args:
        - DEPLOYMENT_SHA=${DEPLOYMENT_SHA:-unknown}
        - DEPLOYMENT_MODE=containerized_staging
    # Use python3 (already in image) — avoids adding curl to Dockerfile
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (staging port to avoid collision with dev/prod) ─────────────
  frontend:
    networks:
      - staging-internal
    ports:
      - "127.0.0.1:18080:80"
    build:
      args:
        - VITE_API_BASE=/api/v1

volumes:
  staging_postgres_data:
    name: tradingagents-p125-staging_postgres_data

networks:
  staging-internal:
    # Use a distinct name that does NOT collide with the auto-generated name of
    # the base 'internal' network (tradingagents-p125-staging_internal).
    name: tradingagents-p125-staging_net
    driver: bridge
  internal:
    driver: bridge
